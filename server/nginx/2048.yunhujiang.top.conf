# 2048 子域名反代到本机 :9000
# 用法（在 Debian/Ubuntu 服务器上）：
#   sudo cp 2048.yunhujiang.top.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/2048.yunhujiang.top.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 前置：DNS 已添加 A 记录 2048 -> 本机公网 IP；本机 9000 已有服务在跑。

server {
    listen 80;
    listen [::]:80;
    server_name 2048.yunhujiang.top;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 若 9000 为 WebSocket，取消下面两行注释：
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }
}
